name: Deploy JUNI Architecture Explorer

on:
  push:
    branches: ["main"]
    paths:
      - "juni-architecture-explorer/**"
      - ".github/workflows/architecture-explorer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: juni-architecture-explorer/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: juni-architecture-explorer
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: juni-architecture-explorer
        run: pnpm check

      - name: Build site
        working-directory: juni-architecture-explorer
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: juni-architecture-explorer/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

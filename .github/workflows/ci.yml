name: CI

on:
  push:
    branches: ["main", "feature/**", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Upload generated lockfile for bootstrap
        if: github.ref == 'refs/heads/fix/open-items-1-2-5'
        uses: actions/upload-artifact@v4
        with:
          name: juni-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Run tests
        run: npm test
